<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
    <title>Game of Life</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <meta charset="UTF-8" />
</head>

<body>
    <header>The Game of Life! :3</header>
    <p class="flavorText" style="color: #FAFAFA; font-size: 18px;">placeholder</p>
    <section class="stats">
        <p style="color: #FAFAFA; font-size: 20px;">Generation: <span id="genNum">0</span></p>
        <p class="errorMsg"></p>
    </section>
    <section class="sim">
        <canvas></canvas>
    </section>
    <footer class="toolbar">
        <button class="simSizeSmall">Small</button>
        <button class="simSizeMedium">Medium</button>
        <button class="simSizeLarge">Large</button>
        <br>
        <input type="number" min="15" max="170" id="customRows" placeholder="Rows">
        <input type="number" min="15" max="170" id="customColumns" placeholder="Columns">
        <button class="applyCustomSize">Apply</button>
        <br>
        <button class="clearButton">Clear</button>
        <button class="randomButton">Random</button>
        <br>
        <label for="speedSlider" style="color: #FAFAFA; font-size: 18px;">Speed:</label>
        <input type="range" min="10" max="500" value="125" class="speedSlider">
        <br>
        <button class="startButton">Start</button>
        <button class="stepButton">Step</button>
    </footer>
</body>

</html>
